version = 1
question = "repair-cost-1: with a Sol-high reviewer, which repair setup reaches equal correctness at the lowest total cost with a median of at most 2 repairs?"
hypothesis = "exploratory: a Sol-high fixer or a stronger builder cuts repairs; review-limit counterfactuals compared with Sol-low pooled results"
purpose = "development"
changes = ["execution", "information"]
objective = "correctness"
baseline = "low"
tasks = ["../../tasks/r70-5-go", "../../tasks/r70-7-go", "../../tasks/r70-5-elixir", "../../tasks/r70-7-elixir", "../../../confirmation-tasks-private/tasks/env-go", "../../../confirmation-tasks-private/tasks/env-ex", "../../../confirmation-tasks-private/tasks/sched-go"]
repetitions = 1
hosts = ["local", "local-2", "local-3", "eu2", "eu2-2", "laptop"]
seed = 20261019

[rule]
policy = "descriptive"

[shared]
roles.shaper = { provider = "openai", model = "gpt-6-luna", effort = "low" }
roles.planner = { provider = "openai", model = "gpt-6-luna", effort = "low" }
roles.builder = { provider = "openai", model = "gpt-6-luna", effort = "low" }
roles.reviewer = { provider = "openai", model = "gpt-6.1-sol", effort = "high" }
roles.fixer = { provider = "openai", model = "gpt-6.1-sol", effort = "high" }
shape.source = "supplied"
shape.supplied = "gherkin"
stop.max_repairs = 6
stop.max_tokens = 100000

[variant.low]

[variant.fixer]
repair.roles = ["fixer"]
repair.conversation = "fresh"
repair.context = ["packet", "diff", "changed_files", "check_results", "review_findings"]

[variant.luna-high]
roles.builder = { provider = "openai", model = "gpt-6-luna", effort = "high" }

[variant.sol-low]
roles.builder = { provider = "openai", model = "gpt-6.1-sol", effort = "low" }
