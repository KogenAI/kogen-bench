version = 1
question = "claude-roles-1: how do Claude Sonnet as reviewer, Claude Haiku as builder, and an all-Sonnet setup compare with the ChatGPT roles on correctness, tokens and dollars?"
hypothesis = "exploratory: descriptive comparison per role; Sol-high reference reused from rf1"
purpose = "development"
changes = ["execution", "information"]
objective = "correctness"
baseline = "sol-low"
tasks = ["../../tasks/r70-5-go", "../../tasks/r70-7-go", "../../tasks/r70-5-elixir", "../../tasks/r70-7-elixir", "../../../confirmation-tasks-private/tasks/env-go", "../../../confirmation-tasks-private/tasks/env-ex", "../../../confirmation-tasks-private/tasks/sched-go"]
repetitions = 1
hosts = ["local", "local-2", "local-3", "eu2", "eu2-2", "laptop"]
seed = 20261020

[rule]
policy = "descriptive"

[shared]
roles.shaper = { provider = "openai", model = "gpt-6-luna", effort = "low" }
roles.planner = { provider = "openai", model = "gpt-6-luna", effort = "low" }
roles.builder = { provider = "openai", model = "gpt-6-luna", effort = "low" }
roles.reviewer = { provider = "openai", model = "gpt-6.1-sol", effort = "low" }
shape.source = "supplied"
shape.supplied = "gherkin"
stop.max_repairs = 6
stop.max_tokens = 100000

[variant.sol-low]

[variant.sonnet-review]
roles.reviewer = { provider = "anthropic", model = "claude-sonnet-5-5", effort = "medium" }

[variant.haiku-build]
roles.builder = { provider = "anthropic", model = "claude-haiku-5-5", effort = "medium" }

[variant.luna-medium-build]
roles.builder = { provider = "openai", model = "gpt-6-luna", effort = "medium" }

[variant.all-sonnet]
roles.planner = { provider = "anthropic", model = "claude-sonnet-5-5", effort = "medium" }
roles.builder = { provider = "anthropic", model = "claude-sonnet-5-5", effort = "medium" }
roles.reviewer = { provider = "anthropic", model = "claude-sonnet-5-5", effort = "medium" }
