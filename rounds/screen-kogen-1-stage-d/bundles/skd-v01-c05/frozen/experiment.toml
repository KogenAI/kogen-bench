# screen-kogen-1 stage d (amendment 4): v01-verify-off, c05-review-advisory; compared with skc-baseline per task.
# Reviewer gpt-6.1-sol low (review-convergence-1); experimental stops on every cell, so not the Kogen-equivalent profile (CFG-7).
version = 1
question = "Stage d of screen-kogen-1: how do single Kogen levers change correctness and cost on gpt-6-luna low with a Sol-low reviewer?"
hypothesis = "exploratory screening; removing verification (V01) lowers correctness"
purpose = "screening"
changes = ["execution", "information", "representation"]
objective = "correctness"
baseline = "v01-verify-off"
tasks = ["../../tasks/ledger-ex", "../../tasks/rate-go", "../../tasks/r70-5-go", "../../tasks/r70-7-go"]
repetitions = 1
hosts = ["local-3"]
seed = 20261018

[rule]
policy = "descriptive"

[shared]
roles.shaper = { provider = "openai", model = "gpt-6-luna", effort = "low" }
roles.planner = { provider = "openai", model = "gpt-6-luna", effort = "low" }
roles.builder = { provider = "openai", model = "gpt-6-luna", effort = "low" }
roles.reviewer = { provider = "openai", model = "gpt-6.1-sol", effort = "low" }
shape.source = "supplied"
shape.supplied = "gherkin"
stop.max_repairs = 6
stop.max_tokens = 100000

[variant.v01-verify-off]
verify.enabled = false

[variant.c05-review-advisory]
review.effect = "advisory"
