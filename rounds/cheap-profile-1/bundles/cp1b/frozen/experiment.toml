version = 1
question = "cheap-profile-1: does a Sol-low builder with a Sol-medium reviewer-fixer keep Kogen's default correctness on the harder tasks at a much lower total input?"
hypothesis = "exploratory: same correctness, total input at least 25% lower"
purpose = "development"
changes = ["execution"]
objective = "correctness"
baseline = "kogen-default"
tasks = ["../../tasks/r70-1-go", "../../tasks/r70-4-go", "../../tasks/r70-7-elixir", "../../tasks/r70-7-go"]
repetitions = 1
hosts = ["local", "local-2", "local-3"]
seed = 20261049

[rule]
policy = "descriptive"

[shared]
shape.source = "supplied"
shape.supplied = "gherkin"
stop.max_repairs = 6
stop.max_command_seconds = 900
stop.max_wall_seconds = 3600

[variant.kogen-default]

[variant.cheap]
roles.builder = { provider = "openai", model = "gpt-6.1-sol", effort = "low" }
roles.reviewer = { provider = "openai", model = "gpt-6.1-sol", effort = "medium" }
