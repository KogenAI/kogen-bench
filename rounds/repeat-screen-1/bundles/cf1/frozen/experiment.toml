version = 1
question = "repeat-screen-1: with Kogen b2c9876b defaults on the harder tasks and two repetitions, does a Sol-medium reviewer-fixer or turning the planner on change correctness, wrong submissions, tokens or time against the defaults?"
hypothesis = "exploratory: Sol medium matches Sol high at lower cost (fixer-model-1, review-fix-1); the planner changes little (planner-direct-1/2)"
purpose = "development"
changes = ["execution"]
objective = "correctness"
baseline = "defaults"
tasks = ["../../tasks/r70-4-go", "../../tasks/r70-1-go", "../../tasks/r70-4-elixir-2", "../../tasks/r70-6-elixir-2"]
repetitions = 2
hosts = ["eu2", "eu2-2", "laptop"]
seed = 20261030

[rule]
policy = "descriptive"

[shared]
shape.source = "supplied"
shape.supplied = "gherkin"
stop.max_command_seconds = 900
stop.max_wall_seconds = 3600

[variant.defaults]

[variant.reviewer-medium]
roles.reviewer = { provider = "openai", model = "gpt-6.1-sol", effort = "medium" }

[variant.planner-on]
plan.enabled = true
