version = 1
question = "review-independence-1: does a reviewer that sees the builder's conversation approve earlier and let more wrong code through?"
hypothesis = "exploratory: shared review approves earlier; wrong submissions may rise"
purpose = "development"
changes = ["information"]
objective = "correctness"
baseline = "fresh"
tasks = ["../../../confirmation-tasks-private/tasks/env-go", "../../../confirmation-tasks-private/tasks/sched-go", "../../tasks/r70-5-go", "../../tasks/r70-5-elixir"]
repetitions = 3
hosts = ["local", "local-2", "local-3", "eu2", "eu2-2", "laptop"]
seed = 20261019

[rule]
policy = "descriptive"

[shared]
roles.shaper = { provider = "openai", model = "gpt-6-luna", effort = "low" }
roles.planner = { provider = "openai", model = "gpt-6-luna", effort = "low" }
roles.builder = { provider = "openai", model = "gpt-6-luna", effort = "low" }
roles.reviewer = { provider = "openai", model = "gpt-6.1-sol", effort = "low" }
shape.source = "supplied"
shape.supplied = "gherkin"
stop.max_repairs = 6
stop.max_tokens = 100000

[variant.fresh]

[variant.shared]
review.independence = "shared"
