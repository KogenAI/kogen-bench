[package]
name = "kogen"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
