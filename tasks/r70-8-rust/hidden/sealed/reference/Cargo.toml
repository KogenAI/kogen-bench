[package]
name = "agent-loop"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "loop"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "time", "signal", "io-util"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
libc = "=0.2.177"
